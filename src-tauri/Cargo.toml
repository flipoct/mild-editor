[package]
name = "mild-editor"
version = "1.2.0"
description = "A lightweight competitive programming editor"
authors = ["mild editor"]
edition = "2021"

[lib]
name = "mild_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
wait-timeout = "0.2"
which = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
scraper = "0.24"
