name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.target || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install CEF (macOS)
        if: startsWith(matrix.platform, 'macos')
        # The problem panel embeds Chromium. cef-dll-sys builds its wrapper with Ninja, and
        # export-cef-dir downloads the pinned CEF binaries. --target matters: the runners are
        # arm64, so without it the x86_64 job would bundle an arm64 framework.
        run: |
          brew install ninja
          git clone --depth 1 --branch cef-v151.8.1+151.3.24 https://github.com/tauri-apps/cef-rs "$RUNNER_TEMP/cef-rs"
          (cd "$RUNNER_TEMP/cef-rs" && cargo run -p export-cef-dir -- --force --target ${{ matrix.target }} "$RUNNER_TEMP/cef")
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"

      - run: npm ci

      # tauri-action runs `tauri build` itself, so the framework and helper bundles are
      # staged here rather than through the npm scripts.
      - name: Stage CEF for the bundle (macOS)
        if: startsWith(matrix.platform, 'macos')
        # The target is passed so the helper binary is built for the architecture being
        # bundled rather than for the runner.
        run: scripts/prepare-cef.sh release ${{ matrix.target }}

      - name: Test application
        # --all-targets so a binary that fails to compile is reported here rather than
        # part-way through the bundle step.
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app only installs updates that verify
          # against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Mild Editor __VERSION__
          releaseBody: |
            ## What's changed in v1.7.1

            - **Imports can go into folders.** Settings → online judges has a new "file imports into folders" option, off by default. With it on, a problem lands under its judge and a contest gets a folder of its own inside it: `Codeforces/Codeforces Round 1117 (Div. 2)/A_Watermelon.py`. The import dialog, contest URLs and Competitive Companion all follow it.
            - Tabs show the file name rather than its whole path, with the path in the tooltip.

            See [`CHANGELOG.md`](https://github.com/flipoct/mild-editor/blob/v1.7.1/CHANGELOG.md) for the patch notes.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: Mild-Editor_[version]_[platform]_[arch][setup].[ext]
          args: ${{ matrix.args }}

      - name: Upload Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $asset = "Mild-Editor_${version}_windows_x64-portable.exe"
          Copy-Item -LiteralPath "src-tauri/target/release/mild-editor.exe" -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber

      - name: Verify macOS app signature
        if: startsWith(matrix.platform, 'macos')
        run: |
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          MOUNT_PATH=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          APP_PATH=$(find "$MOUNT_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil detach "$MOUNT_PATH"
