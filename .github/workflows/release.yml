name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.target || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Test application
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app only installs updates that verify
          # against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Mild Editor __VERSION__
          releaseBody: |
            ## What's changed in v1.5.0

            - Add a default language for imported problems, including Competitive Companion, and for new files created without an extension; the status-bar language menu edits it while no file is open.
            - Rename files and folders in place in the Explorer: Return (macOS) or F2 turns the row into a text field with the name selected, and a bare name takes the default language's extension.
            - Run whatever panel is showing with Cmd/Ctrl+Return — the test cases or the interactive runner — including from inside the editor.
            - Keep the Explorer context menu on screen when it opens near the right or bottom edge.
            - Add an interface scale from 50% to 200% in Settings → appearance and on Cmd/Ctrl+= / − / 0, with matching macOS View menu items.
            - macOS: keep the title bar at its native height under interface zoom and centre the traffic lights in it.
            - macOS: Explorer rows take focus on click, so Return, F2, Cmd+Backspace, and Reveal in Finder act on the clicked row.

            See [`CHANGELOG.md`](https://github.com/flipoct/mild-editor/blob/v1.5.0/CHANGELOG.md) for the patch notes.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: Mild-Editor_[version]_[platform]_[arch][setup].[ext]
          args: ${{ matrix.args }}

      - name: Upload Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $asset = "Mild-Editor_${version}_windows_x64-portable.exe"
          Copy-Item -LiteralPath "src-tauri/target/release/mild-editor.exe" -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber

      - name: Verify macOS app signature
        if: startsWith(matrix.platform, 'macos')
        run: |
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          MOUNT_PATH=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          APP_PATH=$(find "$MOUNT_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil detach "$MOUNT_PATH"
