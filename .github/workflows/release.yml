name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --config src-tauri/tauri.cef.windows.conf.json

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Toolchains, the Rust cache saved from main by the warm-cache workflow, and the
      # embedded Chromium. Nothing is tested here: the Check workflow has already compiled
      # and tested every platform on the way to main, and a release that fails to build
      # fails here regardless.
      - uses: ./.github/actions/setup-build
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app only installs updates that verify
          # against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Mild Editor __VERSION__
          releaseBody: |
            ## What's changed in v1.12.0

            - **Move files and folders.** Drag a row of the explorer onto a folder, or use *Move to…* in its context menu. Tabs, tests and a running contest follow the move.
            - **A contest without a workspace of its own.** *Start a contest* asks which folder the problems come from and lets you leave some out. Problems accepted before the clock started no longer count as solved.
            - **Submission results are announced** in the editor when the verdict of a new submission arrives, whichever file is open.
            - On Windows the close button answers from the very corner of the screen.

            See [`CHANGELOG.md`](https://github.com/flipoct/mild-editor/blob/v1.12.0/CHANGELOG.md) for the patch notes.
          releaseDraft: false
          # A tag with a pre-release suffix (v1.8.0-rc.1) builds a test release that stays
          # out of "latest" and publishes no latest.json, so installed copies do not update
          # to it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: ${{ !contains(github.ref_name, '-') }}
          releaseAssetNamePattern: Mild-Editor_[version]_[platform]_[arch][setup].[ext]
          args: ${{ matrix.args }}

      - name: Upload Windows portable build
        if: matrix.platform == 'windows-latest'
        # The executable imports libcef.dll, so the portable build is a zip of the exe with
        # the CEF runtime beside it rather than a bare exe.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $stage = "Mild-Editor_${version}_windows_x64-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/mild-editor.exe" -Destination $stage
          Copy-Item -Path "src-tauri/cef/win/*" -Destination $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -CompressionLevel Optimal
          gh release upload $env:RELEASE_TAG "$stage.zip" --clobber

      - name: Verify macOS app signature
        if: startsWith(matrix.platform, 'macos')
        run: |
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          MOUNT_PATH=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          APP_PATH=$(find "$MOUNT_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil detach "$MOUNT_PATH"
