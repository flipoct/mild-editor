name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --config src-tauri/tauri.cef.conf.json
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --config src-tauri/tauri.cef.windows.conf.json

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.target || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install CEF (macOS)
        if: startsWith(matrix.platform, 'macos')
        # The problem panel embeds Chromium. cef-dll-sys builds its wrapper with Ninja, and
        # export-cef-dir downloads the pinned CEF binaries. --target matters: the runners are
        # arm64, so without it the x86_64 job would bundle an arm64 framework.
        run: |
          brew install ninja
          git clone --depth 1 --branch cef-v151.8.1+151.3.24 https://github.com/tauri-apps/cef-rs "$RUNNER_TEMP/cef-rs"
          (cd "$RUNNER_TEMP/cef-rs" && cargo run -p export-cef-dir -- --force --target ${{ matrix.target }} "$RUNNER_TEMP/cef")
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"

      - name: Install CEF (Windows)
        if: matrix.platform == 'windows-latest'
        # Same pinned binaries as macOS. The cef crate builds libcef_dll_wrapper with CMake's
        # Ninja generator, which needs cl.exe on PATH: msvc-dev-cmd below provides it.
        shell: pwsh
        run: |
          choco install ninja --no-progress -y
          git clone --depth 1 --branch cef-v151.8.1+151.3.24 https://github.com/tauri-apps/cef-rs "$env:RUNNER_TEMP/cef-rs"
          Push-Location "$env:RUNNER_TEMP/cef-rs"
          cargo run -p export-cef-dir -- --force --target ${{ matrix.target }} "$env:RUNNER_TEMP/cef"
          Pop-Location
          "CEF_PATH=$env:RUNNER_TEMP/cef" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows-latest'

      - run: npm ci

      # tauri-action runs `tauri build` itself, so the framework and helper bundles are
      # staged here rather than through the npm scripts.
      - name: Stage CEF for the bundle (macOS)
        if: startsWith(matrix.platform, 'macos')
        # The target is passed so the helper binary is built for the architecture being
        # bundled rather than for the runner.
        run: scripts/prepare-cef.sh release ${{ matrix.target }}

      - name: Stage CEF for the bundle (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: scripts/prepare-cef.ps1

      # tauri-action compiles the crate itself straight after this, so checking it here
      # would be the same work twice; the Check workflow has already compiled every
      # platform on the way to main. Only the tests, and only where they are quick.
      - name: Test
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app only installs updates that verify
          # against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Mild Editor __VERSION__
          releaseBody: |
            ## What's changed in v1.8.1

            - **macOS opens in full screen.** The window used to open at a fixed size in the middle of the display on every launch.

            See [`CHANGELOG.md`](https://github.com/flipoct/mild-editor/blob/v1.8.1/CHANGELOG.md) for the patch notes.
          releaseDraft: false
          # A tag with a pre-release suffix (v1.8.0-rc.1) builds a test release that stays
          # out of "latest" and publishes no latest.json, so installed copies do not update
          # to it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: ${{ !contains(github.ref_name, '-') }}
          releaseAssetNamePattern: Mild-Editor_[version]_[platform]_[arch][setup].[ext]
          args: ${{ matrix.args }}

      - name: Upload Windows portable build
        if: matrix.platform == 'windows-latest'
        # The executable imports libcef.dll, so the portable build is a zip of the exe with
        # the CEF runtime beside it rather than a bare exe.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $stage = "Mild-Editor_${version}_windows_x64-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/mild-editor.exe" -Destination $stage
          Copy-Item -Path "src-tauri/cef/win/*" -Destination $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -CompressionLevel Optimal
          gh release upload $env:RELEASE_TAG "$stage.zip" --clobber

      - name: Verify macOS app signature
        if: startsWith(matrix.platform, 'macos')
        run: |
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          MOUNT_PATH=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          APP_PATH=$(find "$MOUNT_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          hdiutil detach "$MOUNT_PATH"
